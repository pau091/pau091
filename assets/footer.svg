<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="40" viewBox="0 0 1000 40">
<style>@font-face{font-family:'M';font-weight:700;src:url(data:font/woff;base64,) format('woff');} text{font-family:'M','Montserrat','Segoe UI',Arial,sans-serif;}</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="bar" x1="0" x2="1">
    <stop offset="0" stop-color="#b5527f"/><stop offset="1" stop-color="#ff8fbf"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ff8fbf" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#ff8fbf" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd1e3"/><stop offset="1" stop-color="#b5527f"/>
  </linearGradient>
</defs>
  <line x1="0" y1="20" x2="380" y2="20" stroke="#3a2130" stroke-width="2"/>
  <line x1="620" y1="20" x2="1000" y2="20" stroke="#3a2130" stroke-width="2"/>
  <text x="500" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#ff8fbf" letter-spacing="4" filter="url(#softglow)">QUEST IN PROGRESS</text>
</svg>