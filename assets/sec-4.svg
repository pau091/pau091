<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64">
<style>@font-face{font-family:'M';font-weight:800;src:url(data:font/woff;base64,) format('woff');} text{font-family:'M','Montserrat','Segoe UI',Arial,sans-serif;}</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="bar" x1="0" x2="1">
    <stop offset="0" stop-color="#7b3fbf"/><stop offset="1" stop-color="#c06cff"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#c06cff" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#c06cff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e4b8ff"/><stop offset="1" stop-color="#7b3fbf"/>
  </linearGradient>
</defs>
  <rect x="0" y="12" width="6" height="34" rx="3" fill="#c06cff" filter="url(#softglow)"/>
  <text x="22" y="40" font-size="22" font-weight="800" fill="#ece6f7" letter-spacing="3">ESTADÍSTICAS</text>
  <text x="1000" y="40" text-anchor="end" font-size="14" font-weight="800" fill="#7b3fbf" letter-spacing="3">04</text>
  <line x1="22" y1="56" x2="1000" y2="56" stroke="#2b2140" stroke-width="2"/>
  <line x1="22" y1="56" x2="160" y2="56" stroke="#c06cff" stroke-width="2" filter="url(#softglow)"/>
</svg>